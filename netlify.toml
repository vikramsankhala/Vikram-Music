# Netlify config at repo root — ensures correct deploy when connected via Git

[build]
  publish = "."

# Route "/" to the actual app entry (kept under /website).
[[redirects]]
  from = "/"
  to = "/website/index.html"
  status = 200

# Expose Home Studio as a top-level section.
[[redirects]]
  from = "/home-studio"
  to = "/home-studio/index.html"
  status = 200

[[redirects]]
  from = "/home-studio/*"
  to = "/home-studio/index.html"
  status = 200

# Fallback: serve the main app for all other paths (SPA-like behavior).
[[redirects]]
  from = "/*"
  to = "/website/index.html"
  status = 200
